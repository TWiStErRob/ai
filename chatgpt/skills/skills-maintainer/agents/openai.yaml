interface:
  display_name: Skills Maintainer
  short_description: "Sync skills between ChatGPT and GitHub"
  default_prompt: Use $skills-maintainer to improve a live ChatGPT skill and preserve
    the exact result in GitHub.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
dependencies:
  tools:
  - type: mcp
    value: github
    description: Read and write the Git repository that records managed skills.
    transport: streamable_http
    url: https://api.githubcopilot.com/mcp/
policy:
  allow_implicit_invocation: true
  products:
  - chatgpt
  - codex
  - api
  - atlas
