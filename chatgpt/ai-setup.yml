# yaml-language-server: $schema=../ai-setup.schema.json

home:
  # ChatGPT web has no local tool home; this keeps the manifest compatible with
  # the repository-wide ai-setup schema. The links below are also the explicit
  # allow-list used for ChatGPT package/export/deploy workflows.
  default: ~/.chatgpt

links:
  skills/notion-ingest-content: ../agents/skills/notion-ingest-content
  skills/notion-ingest-event: ../agents/skills/notion-ingest-event
  skills/notion-ingest-watchlist: ../agents/skills/notion-ingest-watchlist
  skills/skills-maintainer: skills/skills-maintainer
